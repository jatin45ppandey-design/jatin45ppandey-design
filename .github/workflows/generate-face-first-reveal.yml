name: Generate face-first profile reveal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-face-first-reveal.yml"
      - "scripts/generate_face_first_reveal.py"
      - "assets/profile-photo.jpg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pillow
      - run: python scripts/generate_face_first_reveal.py
      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-photo-face-first-reveal.gif
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add face-first profile reveal GIF"
            git push
          fi
