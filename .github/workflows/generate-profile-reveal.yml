name: Generate cinematic profile reveal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-profile-reveal.yml"
      - "scripts/generate_profile_reveal.py"
      - "assets/profile-photo.jpg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate cinematic reveal GIF
        run: python scripts/generate_profile_reveal.py

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-photo-cinematic-reveal.gif
          if git diff --cached --quiet; then
            echo "No GIF changes to commit."
          else
            git commit -m "Generate cinematic profile reveal GIF"
            git push
          fi
